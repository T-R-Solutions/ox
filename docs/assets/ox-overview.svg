<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc"><title id="title">Ox — fundação desktop local</title><desc id="desc">Rust e Iced. Um workspace local, um processo supervisionado e uma verificação independente. Versão interna 0.1.0, sem integração com agentes reais.</desc><rect x="1" y="1" width="1098" height="368" rx="20" fill="#f8fafc" stroke="#cbd5e1"/><g font-family="Arial,sans-serif"><text x="40" y="82" font-size="56" font-weight="700" fill="#172554">Ox</text><text x="40" y="130" font-size="30" fill="#172554">Trabalho local. Resultados verificáveis.</text><text x="40" y="166" font-size="22" fill="#475569">Fundação desktop em Rust / Iced · versão interna 0.1.0</text><rect x="40" y="206" width="328" height="126" rx="12" fill="#ffffff" stroke="#a5b4fc"/><g transform="translate(60 224) scale(1.5)" color="#4338ca"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></g><text x="60" y="288" font-size="22" font-weight="700" fill="#172554">Workspace local</text><text x="60" y="314" font-size="17" fill="#475569">Arquivos no diretório escolhido</text><rect x="386" y="206" width="328" height="126" rx="12" fill="#ffffff" stroke="#a5b4fc"/><g transform="translate(406 224) scale(1.5)" color="#4338ca"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g></g><text x="406" y="288" font-size="22" font-weight="700" fill="#172554">Execução supervisionada</text><text x="406" y="314" font-size="17" fill="#475569">Processo, prazo e cancelamento</text><rect x="732