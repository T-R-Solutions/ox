<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" aria-labelledby="title desc"><title id="title">Arquitetura executável da fundação local</title><desc id="desc">Desktop Iced chama Controller. O Controller coordena Agent Runtime e Verification Engine no processo Ox. Runtime supervisiona o produtor local-task. Engine executa o oráculo task-oracle. O produtor escreve os arquivos da tentativa, lidos pelo oráculo. Plugin Host permanece uma API independente da UI.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="960" height="744" fill="#fff"/><g font-family="Arial,sans-serif"><rect x="24" y="24" width="912" height="376" rx="16" fill="#f8fafc" stroke="#64748b"/><text x="48" y="60" font-size="20" font-weight="700" fill="#172554">PROCESSO OX · coordenação e estado em memória</text><rect x="24" y="432" width="912" height="164" rx="16" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/><text x="350" y="454" font-size="18" font-weight="700" fill="#172554">PROCESSOS FILHOS</text><rect x="80" y="96" width="220" height="104" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><g transform="translate(96 114) scale(1.4)" color="#4338ca"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8m-4-4v4"/></g></g><text x="140" y="136" font-size="18" font-weight="700" fill="#172554">Desktop Iced</text><text x="98" y="180" font-size="15" font-weight="400" fill="#172554">Ações e estados da UI</text><rect x="360" y="96" width="240" height="104" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><g transform="translate(376 114) scale(1.4)" color="#4338ca"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 