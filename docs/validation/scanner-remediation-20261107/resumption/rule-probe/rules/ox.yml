rules:
  - id: ox.rust.unsafe-block
    languages: [rust]
    severity: ERROR
    message: "Review first-party unsafe against POL-01; compiler forbid remains authoritative."
    pattern: unsafe { ... }
  - id: ox.python.dynamic-eval
    languages: [python]
    severity: WARNING
    message: "Review dynamic code execution and the origin of its input."
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: ox.python.shell-true
    languages: [python]
    severity: WARNING
    message: "Review shell interpretation and untrusted command inputs."
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
  - id: ox.rust.unsafe-function
    languages: [rust]
    severity: ERROR
    message: "First-party unsafe functions require rejection under POL-01."
    pattern: unsafe fn $F(...) { ... }
  - id: ox.rust.shell-interpreter
    languages: [rust]
    severity: INFO
    message: "Review interpreter arguments and input provenance before process execution."
    pattern-either:
      - pattern: std::process::Command::new("sh")
      - pattern: std::process::Command::new("bash")
      - pattern: Command::new("sh")
      - pattern: Command::new("bash")
  - id: ox.python.unsafe-deserialization
    languages: [python]
    severity: WARNING
    message: "Untrusted pickle or unrestricted YAML may execute arbitrary code."
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.unsafe_load(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load($DATA, yaml.SafeLoader)
          - pattern-not: yaml.load($DATA, yaml.CSafeLoader)
  - id: ox.python.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: "Do not disable peer certificate verification."
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
  - id: ox.rust.unsafe-impl
    languages: [rust]
    severity: ERROR
    message: "First-party unsafe trait implementations violate POL-01; compiler remains authoritative."
    pattern: unsafe impl $TRAIT for $TYPE { ... }
  - id: ox.rust.tls-verification-disabled
    languages: [rust]
    severity: ERROR
    message: "Disabling certificate or hostname verification removes TLS peer authentication."
    pattern-either:
      - pattern: $BUILDER.danger_accept_invalid_certs(true)
      - pattern: $BUILDER.danger_accept_invalid_hostnames(true)
