[package]
name = "ox-persistence-preflight"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace]
resolver = "3"

[dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup"] }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "fira-sans", "thread-pool"] }

[profile.dev]
debug = 0
[profile.dev.package.tiny-skia]
opt-level = 3
