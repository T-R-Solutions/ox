# Entrada do projeto: controlador Sol; execução proporcional conforme procedimento.
# Uso e limites: docs/development/codex-agents.md.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Leia e siga obrigatoriamente docs/development/codex-agents.md, procedimento
canônico de entrada, triagem, delegação, capacidades e retomada.
A sessão raiz é o controlador Sol médio: faz triagem sem assumir as restrições
do especialista ec_triador delegado. Não crie outro triador para repetir a análise.
Leitura/diagnóstico e reparo local claro, autorizado e recuperável podem seguir
diretamente somente nas condições de sdd/workflow.md e sem risco material.
Mudanças com risco material exigem ec_orquestrador_alta, revisão e validação
independentes. Se faltar capacidade necessária, bloqueie a etapa dependente;
não use execução direta ou autorrevisão como substituto. Respeite restrições
expressas do usuário e do host. Acompanhe os encaminhamentos até resultado
ou bloqueio, conforme o procedimento canônico.
"""
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"
