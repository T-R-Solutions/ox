# Reviewed dependency policy: dependency-hygiene, 2026-11-09.
# Permission to use these dependencies does not waive notices/source obligations.
[graph]
all-features = true
[licenses]
allow = ["GPL-3.0-only", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0"]
confidence-threshold = 0.95
[licenses.private]
ignore = false
[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Maintainer disposition 2026-11-09: preserve Iced 0.14. Exact older versions
# only; new versions/families remain denied. Review on graphical stack updates.
skip = [
    { crate = "calloop@=0.13.0", reason = "winit 0.30 requires calloop 0.13; smithay-client-toolkit 0.20 requires 0.14" },
    { crate = "calloop-wayland-source@=0.3.0", reason = "SCTK 0.19 used by winit/adwaita and SCTK 0.20 used by clipboard require distinct generations" },
    { crate = "smithay-client-toolkit@=0.19.2", reason = "winit/adwaita require 0.19; smithay-clipboard 0.7.3 requires 0.20; preserve the current Iced stack" },
    { crate = "rustix@=0.38.44", reason = "winit/calloop 0.13 require 0.38; current Wayland and softbuffer require rustix 1" },
    { crate = "linux-raw-sys@=0.4.15", reason = "Transitive ABI generation of retained rustix 0.38, distinct from rustix 1 dependency" },
    { crate = "rustc-hash@=1.1.0", reason = "cosmic-text 0.15 requires 1.1; Iced 0.14 requires 2; no compatible single version" },
    { crate = "syn@=2.0.119", reason = "Current pin-project/tracing/zerocopy macros require syn 2; current serde/futures/bytemuck macros require syn 3" },
    { crate = "thiserror@=1.0.69", reason = "winit dependencies calloop/SCTK old generations require 1; Iced requires 2" },
    { crate = "thiserror-impl@=1.0.69", reason = "Exact paired proc-macro dependency of the retained thiserror 1.0.69" },
    { crate = "bitflags@=1.3.2", reason = "core-graphics 0.23/core-graphics-types 0.1/redox_syscall 0.4 require 1; Iced/current dependencies require 2" },
    { crate = "getrandom@=0.3.4", reason = "ahash 0.8 requires 0.3; jobserver 0.1.35 requires 0.4 on Windows" },
    { crate = "jni-sys@=0.3.1", reason = "ndk 0.9/ndk-sys require 0.3; jni 0.22 and the 0.3 compatibility shim require 0.4" },
    { crate = "objc2@=0.5.3", reason = "winit 0.30 and clipboard_macos require 0.5; softbuffer 0.4.8 requires 0.6" },
    { crate = "objc2-foundation@=0.2.2", reason = "winit/clipboard_macos use 0.2; softbuffer requires 0.3" },
    { crate = "r-efi@=5.3.0", reason = "getrandom 0.3 requires 5; getrandom 0.4 requires 6 for UEFI backend" },
    { crate = "redox_syscall@=0.4.1", reason = "winit 0.30 requires 0.4; parking_lot_core/softbuffer require 0.5; libredox requires 0.9" },
    { crate = "redox_syscall@=0.5.18", reason = "parking_lot_core/softbuffer require 0.5; libredox requires 0.9" },
    { crate = "windows-sys@=0.52.0", reason = "winit requires 0.52; softbuffer/polling require 0.61; rustix 0.38 unified onto 0.52" },
]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
