# Copied to a private working directory, ahead of any home config.
[advisories]
# Temporary maintainer acceptance, 2026-11-09; review on dependency upgrades
# or maintainer resumption. IDs are informational maintenance notices only.
ignore = ["RUSTSEC-2026-0441", "RUSTSEC-2026-0192"]
informational_warnings = ["unmaintained", "unsound", "notice"]
[database]
fetch = false
stale = false
[output]
deny = ["warnings"]
format = "json"
quiet = false
[yanked]
enabled = false
update_index = false
